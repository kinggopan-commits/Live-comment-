<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YouTube Subscriber Count Bar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* പ്രധാന സബ്സ്ക്രൈബർ ബാർ (ഇതിൽ ടച്ച് ചെയ്താൽ സെറ്റിങ്സ് തുറക്കും) */
    .sub-bar-container {
      position: fixed;
      bottom: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(30, 41, 59, 0.96));
      border: 1.5px solid rgba(239, 68, 68, 0.7);
      border-radius: 50px;
      padding: 8px 20px 8px 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 15px rgba(239, 68, 68, 0.3);
      backdrop-filter: blur(8px);
      z-index: 50;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }
    .sub-bar-container:active {
      transform: scale(0.96);
    }

    /* ചാനൽ ലോഗോ / യൂട്യൂബ് ഐക്കൺ */
    .channel-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid #ffffff;
      flex-shrink: 0;
    }
    .channel-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .yt-play-icon {
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 12px solid #ffffff;
      margin-left: 3px;
    }

    /* ടെക്സ്റ്റ് വിവരങ്ങൾ */
    .sub-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .channel-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #cbd5e1;
    }
    .count-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .sub-count {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
      transition: transform 0.3s ease, color 0.3s ease;
    }
    .sub-count.pop {
      transform: scale(1.15);
      color: #4ade80;
    }
    .sub-label {
      font-size: 11px;
      font-weight: 700;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.18);
      padding: 2px 7px;
      border-radius: 12px;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    /* ലൈവ് സ്റ്റാറ്റസ് ഡോട്ട് */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      margin-left: 4px;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.8s infinite;
    }
    .status-dot.error {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* ബാർ സ്റ്റാറ്റസ് ടെക്സ്റ്റ് */
    .bar-status-pill {
      font-size: 10px;
      font-weight: 600;
      color: #fbbf24;
      margin-top: 1px;
    }
    .bar-status-pill.ok {
      display: none;
    }
    .bar-status-pill.err {
      color: #f87171;
    }

    /* സെറ്റിങ്സ് പോപ്പ്അപ്പ് മോഡൽ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .settings-box {
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 16px;
      padding: 18px;
      width: 92%;
      max-width: 390px;
      color: #f8fafc;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85);
      max-height: 92vh;
      overflow-y: auto;
    }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .settings-header h3 {
      font-size: 15px;
      color: #f87171;
    }
    .close-btn {
      background: #334155;
      border: none;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 12.5px;
      user-select: text;
    }

    /* PRISM Live Link Copy Box */
    .prism-link-box {
      background: rgba(30, 41, 59, 0.9);
      border: 1px dashed #38bdf8;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .prism-link-box label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .copy-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .copy-row input {
      flex: 1;
      padding: 8px 9px;
      border-radius: 7px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 11.5px;
      user-select: all;
    }
    .btn-copy {
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-copy.copied {
      background: #16a34a;
    }
    .prism-hint {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 5px;
      line-height: 1.3;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-save {
      background: #ef4444;
      color: #fff;
    }
    .btn-test {
      background: #22c55e;
      color: #052e16;
    }
    .status-msg {
      margin-top: 10px;
      padding: 8px;
      border-radius: 8px;
      background: #1e293b;
      font-size: 11.5px;
      color: #fbbf24;
      text-align: center;
      word-break: break-word;
    }
    .status-msg.success {
      color: #4ade80;
    }
    .status-msg.error {
      color: #f87171;
    }
  </style>
</head>
<body>

  <!-- സബ്സ്ക്രൈബർ കൗണ്ട് ബാർ (ഇതിൽ ടച്ച് ചെയ്താൽ സെറ്റിങ്സ് തുറക്കും) -->
  <div class="sub-bar-container" id="subBar" title="Tap bar to open settings">
    <div class="channel-avatar" id="avatarBox">
      <div class="yt-play-icon"></div>
    </div>
    <div class="sub-info">
      <div class="channel-title" id="displayChannelName">GOPANKING VLOGGER</div>
      <div class="count-row">
        <span class="sub-count" id="displaySubCount">0</span>
        <span class="sub-label">SUBS</span>
        <span class="status-dot" id="statusDot"></span>
      </div>
      <div class="bar-status-pill" id="barStatusText">Tap bar to connect</div>
    </div>
  </div>

  <!-- സെറ്റിങ്സ് വിൻഡോ -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="settings-box">
      <div class="settings-header">
        <h3>Subscriber Bar Settings</h3>
        <button class="close-btn" id="closeSettingsBtn">✕</button>
      </div>

      <!-- PRISM Live Link Copy Box (http:// എന്ന് തുടങ്ങുന്ന ലിങ്ക്) -->
      <div class="prism-link-box">
        <label>PRISM Live Overlay URL (Starts with http://)</label>
        <div class="copy-row">
          <input type="text" id="prismUrlInput" readonly />
          <button class="btn-copy" id="copyUrlBtn">Copy Link</button>
        </div>
        <div class="prism-hint">ഈ ലിങ്ക് 'http://' എന്നാണ് തുടങ്ങുന്നത്. ഇത് കോപ്പി ചെയ്ത് PRISM Live Studio-യിലെ Web Overlay-യിൽ പേസ്റ്റ് ചെയ്യുക.</div>
      </div>

      <div class="form-group">
        <label>YouTube Data API Key (AIzaSy...)</label>
        <input type="text" id="apiKeyInput" placeholder="Paste YouTube API Key" />
      </div>

      <div class="form-group">
        <label>Channel ID (UC... or @handle)</label>
        <input type="text" id="channelIdInput" placeholder="e.g. UCxxxxxxxxxxxx or @gopankingvlogger" />
      </div>

      <div class="form-group">
        <label>Custom Display Name (Optional)</label>
        <input type="text" id="customNameInput" placeholder="e.g. GOPANKING VLOGGER" />
      </div>

      <div class="btn-row">
        <button class="btn btn-save" id="saveConnectBtn">Save & Connect</button>
        <button class="btn btn-test" id="testPopBtn">Test +1</button>
      </div>
      <div class="status-msg" id="statusText">Enter API Key & Channel ID, then tap Save & Connect</div>
    </div>
  </div>

  <script>
    const subBar = document.getElementById('subBar');
    const closeBtn = document.getElementById('closeSettingsBtn');
    const modal = document.getElementById('settingsModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const channelIdInput = document.getElementById('channelIdInput');
    const customNameInput = document.getElementById('customNameInput');
    const prismUrlInput = document.getElementById('prismUrlInput');
    const copyUrlBtn = document.getElementById('copyUrlBtn');
    const saveConnectBtn = document.getElementById('saveConnectBtn');
    const testPopBtn = document.getElementById('testPopBtn');
    const statusText = document.getElementById('statusText');
    const barStatusText = document.getElementById('barStatusText');
    const statusDot = document.getElementById('statusDot');

    const displayChannelName = document.getElementById('displayChannelName');
    const displaySubCount = document.getElementById('displaySubCount');
    const avatarBox = document.getElementById('avatarBox');

    let currentCount = 0;
    let pollTimer = null;

    // PRISM Live-ലേക്ക് എപ്പോഴും http:// എന്ന് തുടങ്ങുന്ന URL നിർമ്മിക്കുന്നു
    function updatePrismUrlBox() {
      let host = window.location.host;
      let pathname = window.location.pathname;

      // ലോക്കൽ ഫയൽ ആയി തുറന്നാൽ ഡിഫോൾട്ട് GitHub Pages വിലാസം ഉപയോഗിക്കുന്നു
      if (!host || window.location.protocol === 'file:') {
        host = 'kinggopan-commits.github.io';
        pathname = '/Live-comment/';
      }

      const baseUrl = `http://${host}${pathname}`;
      const key = apiKeyInput.value.trim();
      const ch = channelIdInput.value.trim();
      const name = customNameInput.value.trim();

      const params = new URLSearchParams();
      if (key) params.set('key', key);
      if (ch) params.set('ch', ch);
      if (name) params.set('name', name);

      const queryString = params.toString();
      prismUrlInput.value = queryString ? `${baseUrl}?${queryString}` : baseUrl;
    }

    function setConnectionState(state, message) {
      statusText.className = 'status-msg';
      barStatusText.className = 'bar-status-pill';
      statusDot.className = 'status-dot';

      if (state === 'connecting') {
        statusText.textContent = message || 'Connecting...';
        barStatusText.textContent = 'Connecting...';
      } else if (state === 'connected') {
        statusText.textContent = message || 'Connected! Live updating';
        statusText.classList.add('success');
        barStatusText.classList.add('ok');
        statusDot.classList.add('connected');
      } else if (state === 'error') {
        statusText.textContent = message || 'Connection failed';
        statusText.classList.add('error');
        barStatusText.textContent = 'Tap to fix error';
        barStatusText.classList.add('err');
        statusDot.classList.add('error');
      } else {
        statusText.textContent = message || 'Tap Save & Connect';
        barStatusText.textContent = 'Tap bar to connect';
      }
    }

    function loadSavedData() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlKey = urlParams.get('key');
      const urlCh = urlParams.get('ch');
      const urlName = urlParams.get('name');

      const savedKey = urlKey || localStorage.getItem('yt_sub_api_key') || '';
      const savedChannel = urlCh || localStorage.getItem('yt_sub_channel_id') || '';
      const savedName = urlName || localStorage.getItem('yt_sub_custom_name') || 'GOPANKING VLOGGER';
      const savedCount = parseInt(localStorage.getItem('yt_sub_last_count') || '0', 10);

      if (urlKey) localStorage.setItem('yt_sub_api_key', urlKey);
      if (urlCh) localStorage.setItem('yt_sub_channel_id', urlCh);
      if (urlName) localStorage.setItem('yt_sub_custom_name', urlName);

      apiKeyInput.value = savedKey;
      channelIdInput.value = savedChannel;
      customNameInput.value = savedName;
      displayChannelName.textContent = savedName;
      currentCount = savedCount;
      displaySubCount.textContent = currentCount.toLocaleString();

      updatePrismUrlBox();

      if (savedKey && savedChannel) {
        startFetching();
      } else {
        setConnectionState('idle');
      }
    }

    function updateCountUI(newCount) {
      displaySubCount.textContent = newCount.toLocaleString();
      if (newCount !== currentCount) {
        displaySubCount.classList.add('pop');
        setTimeout(() => displaySubCount.classList.remove('pop'), 500);
        currentCount = newCount;
        localStorage.setItem('yt_sub_last_count', currentCount.toString());
      }
    }

    async function fetchSubscriberCount() {
      const key = (localStorage.getItem('yt_sub_api_key') || '').trim();
      const rawChannel = (localStorage.getItem('yt_sub_channel_id') || '').trim();
      if (!key || !rawChannel) {
        setConnectionState('idle', 'Please enter API Key and Channel ID');
        return;
      }

      setConnectionState('connecting', 'Connecting to YouTube...');

      try {
        let param = `id=${encodeURIComponent(rawChannel)}`;
        if (rawChannel.startsWith('@')) {
          param = `forHandle=${encodeURIComponent(rawChannel)}`;
        } else if (!rawChannel.startsWith('UC') && rawChannel.length < 24) {
          param = `forHandle=${encodeURIComponent('@' + rawChannel)}`;
        }

        const url = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&${param}&key=${encodeURIComponent(key)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          const errMsg = data.error.message || 'API Error';
          setConnectionState('error', `Error: ${errMsg}`);
          return;
        }

        if (data.items && data.items.length > 0) {
          const item = data.items[0];
          const subCount = parseInt(item.statistics.subscriberCount || '0', 10);
          const customName = (localStorage.getItem('yt_sub_custom_name') || '').trim();

          if (!customName && item.snippet && item.snippet.title) {
            displayChannelName.textContent = item.snippet.title;
          }
          if (item.snippet && item.snippet.thumbnails && item.snippet.thumbnails.default) {
            avatarBox.innerHTML = `<img src="${item.snippet.thumbnails.default.url}" alt="Avatar" />`;
          }

          updateCountUI(subCount);
          setConnectionState('connected', `Connected! (${subCount.toLocaleString()} subs)`);
        } else {
          setConnectionState('error', 'Channel not found! Check Channel ID or @handle');
        }
      } catch (err) {
        setConnectionState('error', 'Network error! Check internet connection');
      }
    }

    function startFetching() {
      if (pollTimer) clearInterval(pollTimer);
      fetchSubscriberCount();
      pollTimer = setInterval(fetchSubscriberCount, 15000);
    }

    apiKeyInput.addEventListener('input', updatePrismUrlBox);
    channelIdInput.addEventListener('input', updatePrismUrlBox);
    customNameInput.addEventListener('input', updatePrismUrlBox);

    copyUrlBtn.addEventListener('click', async () => {
      updatePrismUrlBox();
      const urlToCopy = prismUrlInput.value;
      try {
        await navigator.clipboard.writeText(urlToCopy);
      } catch (e) {
        prismUrlInput.select();
        document.execCommand('copy');
      }
      copyUrlBtn.textContent = 'Copied!';
      copyUrlBtn.classList.add('copied');
      setTimeout(() => {
        copyUrlBtn.textContent = 'Copy Link';
        copyUrlBtn.classList.remove('copied');
      }, 2000);
    });

    subBar.addEventListener('click', () => {
      updatePrismUrlBox();
      modal.classList.add('open');
    });

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('open');
    });

    saveConnectBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      const chId = channelIdInput.value.trim();
      const cName = customNameInput.value.trim();

      localStorage.setItem('yt_sub_api_key', key);
      localStorage.setItem('yt_sub_channel_id', chId);
      localStorage.setItem('yt_sub_custom_name', cName);

      if (cName) displayChannelName.textContent = cName;
      updatePrismUrlBox();
      startFetching();
    });

    testPopBtn.addEventListener('click', () => {
      updateCountUI(currentCount + 1);
    });

    loadSavedData();
  </script>
</body>
</html>
